[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-home"
version = "0.1.0"
description = "A local-first personal voice assistant with a thin web satellite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "bleak>=0.21",
  "cryptography>=42,<46",
  "opencv-python>=4.8,<5",
]

[project.scripts]
jarvis-server = "jarvis.__main__:main"

[project.optional-dependencies]
lotus = ["lotus-lamp>=1.1.0"]
voice-server = ["openwakeword>=0.6", "sounddevice>=0.5", "faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
